[package]
name = "rs-arrow-ipc2sqlite"
version = "0.1.0"
edition = "2024"

description = "Convert Arrow IPC stream to SQLite database"
license = "Apache-2.0"
repository = "https://github.com/takanoriyanagitani/rs-arrow-ipc2sqlite"
homepage = "https://github.com/takanoriyanagitani/rs-arrow-ipc2sqlite"
documentation = "https://docs.rs/rs-arrow-ipc2sqlite/latest"
keywords = ["arrow", "ipc", "sqlite", "convert", "wasi"]

exclude = [
	"arrow-ipc2sqlite.wasm",
	"input.arrow.ipc.stream.dat",
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[[bin]]
name = "arrow-ipc2sqlite"

[dependencies.rs-bat2sqlite]
version = "0.1.0"
default-features = false
features = [
]

[dependencies.arrow-ipc]
version = "60.1.0"
default-features = false
features = [
  "default",
  "lz4",
]
